<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>Solo Shop - 個人ではじめるオンラインショップ</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto max-w-7xl px-4 py-6">
        <section class="mb-10 rounded-lg bg-brand-50 px-6 py-10 text-center sm:py-14">
          <h1 class="text-xl font-bold text-brand-700 sm:text-2xl">ひとつひとつ、心を込めてお届けしています</h1>
          <p class="mt-2 text-sm text-gray-600 sm:text-base">個人で運営している小さなお店です。ゆっくりとお買い物をお楽しみください。</p>
        </section>

        <section id="recently-viewed-section" class="mb-10 hidden">
          <h2 class="mb-4 text-lg font-bold">最近チェックした商品</h2>
          <div id="recently-viewed-grid"></div>
        </section>

        <section class="mb-10">
          <h2 class="mb-4 text-lg font-bold">カテゴリから探す</h2>
          <div id="categories-grid" class="grid grid-cols-3 gap-3 sm:grid-cols-6"></div>
        </section>

        <section class="mb-10">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-bold">売れ筋商品</h2>
            <a href="products.html?sort=sales" class="text-sm text-brand-500 hover:underline">もっと見る</a>
          </div>
          <div id="popular-grid"></div>
        </section>

        <section>
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-bold">新着商品</h2>
            <a href="products.html?sort=newest" class="text-sm text-brand-500 hover:underline">もっと見る</a>
          </div>
          <div id="newest-grid"></div>
        </section>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/home.js"></script>
  </body>
</html>
