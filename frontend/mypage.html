<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>マイページ - Solo Shop</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solo Shop" />
    <meta property="og:title" content="マイページ - Solo Shop" />
    <meta property="og:description" content="会員情報・お届け先の確認と変更はこちらから。" />
    <meta property="og:url" content="https://shop.example.com/mypage.html" />
    <meta property="og:image" content="https://shop.example.com/assets/img/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto max-w-3xl px-4 py-8">
        <h1 class="mb-6 text-xl font-bold">マイページ</h1>
        <div class="mb-6 flex gap-2">
          <button data-tab="profile" class="tab-btn rounded-full px-4 py-1.5 text-sm">プロフィール</button>
          <button data-tab="addresses" class="tab-btn rounded-full px-4 py-1.5 text-sm">住所管理</button>
          <button data-tab="password" class="tab-btn rounded-full px-4 py-1.5 text-sm">パスワード変更</button>
        </div>

        <p id="message" class="mb-4 hidden rounded bg-blue-50 px-3 py-2 text-sm text-blue-700"></p>

        <div id="tab-profile" class="tab-panel hidden">
          <form id="profile-form" class="card flex max-w-md flex-col gap-4 p-6">
            <div>
              <label class="mb-1 block text-sm text-gray-600">メールアドレス</label>
              <input id="profile-email" class="input bg-gray-100" disabled />
            </div>
            <div>
              <label class="mb-1 block text-sm text-gray-600">氏名</label>
              <input id="profile-name" class="input" />
            </div>
            <div>
              <label class="mb-1 block text-sm text-gray-600">電話番号</label>
              <input id="profile-phone" class="input" />
            </div>
            <button type="submit" class="btn-primary">保存</button>
          </form>
        </div>

        <div id="tab-addresses" class="tab-panel hidden">
          <div id="address-list" class="flex flex-col gap-3"></div>
        </div>

        <div id="tab-password" class="tab-panel hidden">
          <form id="password-form" class="card flex max-w-md flex-col gap-4 p-6">
            <div>
              <label class="mb-1 block text-sm text-gray-600">現在のパスワード</label>
              <input id="current-password" type="password" class="input" />
            </div>
            <div>
              <label class="mb-1 block text-sm text-gray-600">新しいパスワード</label>
              <input id="new-password" type="password" class="input" />
            </div>
            <button type="submit" class="btn-primary">変更する</button>
          </form>
        </div>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/mypage.js"></script>
  </body>
</html>
