<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カート - Solo Shop</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <p id="loading-msg" class="py-16 text-center text-gray-400">読み込み中…</p>

      <div id="empty-cart" class="mx-auto hidden max-w-3xl px-4 py-24 text-center">
        <p class="mb-4 text-gray-500">カートに商品がありません</p>
        <a href="products.html" class="btn-primary">商品を探す</a>
      </div>

      <div id="cart-view" class="mx-auto hidden max-w-4xl px-4 py-8">
        <h1 class="mb-6 text-xl font-bold">ショッピングカート</h1>
        <div class="mb-4" id="shipping-progress"></div>
        <div class="card divide-y" id="cart-items"></div>

        <div class="mt-6 flex flex-col gap-3 rounded bg-white p-4 shadow-sm">
          <p id="unavailable-msg" class="hidden text-sm text-red-500">購入できない商品が含まれています。該当商品を削除するとレジに進めます。</p>
          <div class="flex items-center justify-between">
            <span id="total-qty" class="text-gray-600"></span>
            <div class="flex items-center gap-4">
              <span id="total-amount" class="text-2xl font-bold text-brand-500"></span>
              <button id="checkout-btn" class="btn-primary">レジに進む</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/cart.js"></script>
  </body>
</html>
