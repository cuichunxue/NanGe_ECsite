<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ご注文手続き - Solo Shop</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <p id="loading-msg" class="py-16 text-center text-gray-400">読み込み中…</p>

      <div id="checkout-view" class="mx-auto hidden max-w-3xl px-4 py-8">
        <h1 class="mb-6 text-xl font-bold">ご注文手続き</h1>

        <section class="card mb-6 p-4">
          <h2 class="mb-3 font-semibold">配送先住所</h2>
          <div id="address-list" class="flex flex-col gap-2"></div>
          <button id="show-address-form-btn" class="btn-secondary mt-3">+ 新しい住所を追加</button>
          <div id="address-form" class="mt-3 hidden grid-cols-2 gap-2">
            <input id="addr-recipient" class="input" placeholder="受取人名" />
            <input id="addr-phone" class="input" placeholder="電話番号" />
            <input id="addr-province" class="input" placeholder="都道府県" />
            <input id="addr-city" class="input" placeholder="市区町村" />
            <input id="addr-district" class="input" placeholder="区域" />
            <input id="addr-detail" class="input" placeholder="番地・建物名" />
            <div class="col-span-2 flex gap-2">
              <button id="save-address-btn" class="btn-primary">保存</button>
              <button id="cancel-address-btn" class="btn-secondary">キャンセル</button>
            </div>
          </div>
        </section>

        <section class="card mb-6 p-4">
          <h2 class="mb-3 font-semibold">支払い方法</h2>
          <div class="flex flex-col gap-2 text-sm">
            <label class="flex items-center gap-2"><input type="radio" name="payment" value="CREDIT_CARD" checked /> クレジットカード</label>
            <label class="flex items-center gap-2"><input type="radio" name="payment" value="PAYPAY" /> PayPay</label>
            <label class="flex items-center gap-2"><input type="radio" name="payment" value="COD" /> 代金引換（商品お受け取り時にお支払い）</label>
          </div>
          <p id="payment-note" class="mt-3 text-xs text-gray-500">
            「注文を確定する」を押すと、決済ページへ移動します。お支払い完了後、自動でこの店舗に戻ります。
          </p>
        </section>

        <div class="mb-6" id="shipping-progress"></div>

        <section class="card mb-6 p-4">
          <h2 class="mb-3 font-semibold">注文内容</h2>
          <div class="flex flex-col gap-1 text-sm text-gray-600">
            <div class="flex justify-between"><span>商品小計</span><span id="summary-subtotal"></span></div>
            <div class="flex justify-between"><span>送料</span><span id="summary-shipping"></span></div>
            <div class="mt-2 flex justify-between border-t pt-2 text-base font-bold text-brand-500"><span>合計</span><span id="summary-total"></span></div>
          </div>
        </section>

        <p id="error-msg" class="mb-4 hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>

        <button id="submit-btn" class="btn-primary w-full py-3"></button>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/checkout.js"></script>
  </body>
</html>
