<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ログイン - Solo Shop</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto flex max-w-md flex-col gap-6 px-4 py-16">
        <h1 class="text-center text-2xl font-bold">ログイン</h1>
        <form id="login-form" class="card flex flex-col gap-4 p-6">
          <p id="error-msg" class="hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>
          <div>
            <label class="mb-1 block text-sm text-gray-600">メールアドレス</label>
            <input id="email" type="email" required class="input" />
          </div>
          <div>
            <label class="mb-1 block text-sm text-gray-600">パスワード</label>
            <input id="password" type="password" required class="input" />
            <div class="mt-1 text-right">
              <a href="forgot-password.html" class="text-xs text-gray-500 hover:text-brand-500 hover:underline">パスワードをお忘れですか？</a>
            </div>
          </div>
          <button id="submit-btn" type="submit" class="btn-primary w-full">ログイン</button>
          <p class="text-center text-sm text-gray-500">
            アカウントをお持ちでない方は <a href="register.html" class="text-brand-500 hover:underline">新規登録</a>
          </p>
          <div class="mt-2 rounded bg-gray-50 p-3 text-xs text-gray-500">
            <p>デモ店主(管理者): owner@soloshop.example.com / Owner@12345</p>
            <p>デモ会員: demo@soloshop.example.com / Demo@12345</p>
          </div>
        </form>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/login.js"></script>
  </body>
</html>
