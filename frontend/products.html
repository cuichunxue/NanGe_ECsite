<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商品一覧 - Solo Shop</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto max-w-7xl px-4 py-6">
        <div class="flex flex-col gap-6 md:flex-row">
          <aside class="w-full shrink-0 md:w-56">
            <div class="card p-4">
              <h3 class="mb-2 text-sm font-semibold">カテゴリ</h3>
              <ul id="category-filter" class="flex flex-col gap-1 text-sm"></ul>
              <h3 class="mb-2 mt-4 text-sm font-semibold">価格帯</h3>
              <div class="flex items-center gap-2">
                <input id="min-price" class="input" placeholder="下限" />
                <span>〜</span>
                <input id="max-price" class="input" placeholder="上限" />
              </div>
            </div>
          </aside>

          <div class="min-w-0 flex-1">
            <div class="mb-4 flex items-center justify-between">
              <p id="result-summary" class="text-sm text-gray-500"></p>
              <select id="sort-select" class="input w-40">
                <option value="newest">新着順</option>
                <option value="sales">売れ筋順</option>
                <option value="rating">評価順</option>
                <option value="priceAsc">価格が安い順</option>
                <option value="priceDesc">価格が高い順</option>
              </select>
            </div>

            <p id="loading-msg" class="hidden py-16 text-center text-gray-400">読み込み中…</p>
            <p id="empty-msg" class="hidden py-16 text-center text-gray-400">該当する商品が見つかりませんでした</p>
            <div id="product-grid" class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4"></div>
            <div id="pagination"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/products.js"></script>
  </body>
</html>
