<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注文管理 - 管理画面 - Solo Shop</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-6 lg:flex-row lg:gap-6">
        <aside id="admin-sidebar" class="w-full lg:w-52 lg:shrink-0"></aside>
        <main class="min-w-0 flex-1">
          <div class="flex flex-col gap-4">
            <h1 class="text-xl font-bold">注文管理</h1>
            <select id="status-select" class="input max-w-xs">
              <option value="">すべてのステータス</option>
              <option value="PENDING_PAYMENT">支払い待ち</option>
              <option value="PAID">支払い済み</option>
              <option value="SHIPPED">発送済み</option>
              <option value="COMPLETED">受取完了</option>
              <option value="CANCELLED">キャンセル済み</option>
              <option value="REFUNDED">返金済み</option>
            </select>
            <div class="card overflow-x-auto">
              <table class="w-full min-w-[38rem] text-left text-sm">
                <thead class="bg-gray-50 text-gray-500">
                  <tr>
                    <th class="p-3">注文番号</th>
                    <th class="p-3">会員</th>
                    <th class="p-3">金額</th>
                    <th class="p-3">ステータス</th>
                    <th class="p-3">日時</th>
                    <th class="p-3"></th>
                  </tr>
                </thead>
                <tbody id="order-rows"></tbody>
              </table>
            </div>
            <div id="pagination"></div>
          </div>
        </main>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="../assets/js/pages/admin-orders.js"></script>
  </body>
</html>
