<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カテゴリ管理 - 管理画面 - Solo Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: { extend: { colors: { brand: { 50: '#fdf4ee', 100: '#f8e3d3', 400: '#d98a52', 500: '#c1682f', 600: '#a5551f', 700: '#7c4018' } } } },
      };
    </script>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto flex max-w-7xl gap-6 px-4 py-6">
        <aside id="admin-sidebar" class="w-52 shrink-0"></aside>
        <main class="min-w-0 flex-1">
          <div class="flex flex-col gap-6">
            <h1 class="text-xl font-bold">カテゴリ管理</h1>
            <div class="card p-4">
              <h2 class="mb-3 font-semibold">新規カテゴリ追加</h2>
              <p id="error-msg" class="mb-2 hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>
              <div class="flex gap-2">
                <input id="new-name" class="input" placeholder="カテゴリ名" />
                <button id="add-btn" class="btn-primary shrink-0">追加</button>
              </div>
            </div>
            <div class="card divide-y" id="category-list"></div>
          </div>
        </main>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="../assets/js/pages/admin-categories.js"></script>
  </body>
</html>
