<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注文詳細 - 管理画面 - Solo Shop</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-6 lg:flex-row lg:gap-6">
        <aside id="admin-sidebar" class="w-full lg:w-52 lg:shrink-0"></aside>
        <main class="min-w-0 flex-1">
          <p id="loading-msg" class="py-16 text-center text-gray-400">読み込み中…</p>
          <div id="detail-view" class="hidden max-w-3xl">
            <a href="orders.html" class="text-sm text-brand-500 hover:underline">← 注文一覧に戻る</a>
            <div class="card mt-4 p-6">
              <div class="mb-4 flex items-center justify-between">
                <div>
                  <h1 id="order-no" class="text-lg font-bold"></h1>
                  <p id="order-created" class="text-sm text-gray-400"></p>
                  <p id="order-buyer" class="text-sm text-gray-500"></p>
            <p id="order-payment" class="text-sm text-gray-500"></p>
                </div>
                <span id="order-status-badge" class="rounded px-3 py-1 text-sm"></span>
              </div>

              <p id="error-msg" class="mb-4 hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>

              <div class="mb-4 rounded bg-gray-50 p-3 text-sm text-gray-600">
                <p class="mb-1 font-medium">配送先</p>
                <p id="address-recipient"></p>
                <p id="address-detail"></p>
              </div>

              <div id="order-items" class="divide-y"></div>

              <div class="mt-4 flex justify-between border-t pt-4 text-base font-bold text-brand-500">
                <span>合計</span>
                <span id="order-total"></span>
              </div>

              <div id="status-actions" class="mt-6 hidden gap-3"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="../assets/js/pages/admin-order-detail.js"></script>
  </body>
</html>
