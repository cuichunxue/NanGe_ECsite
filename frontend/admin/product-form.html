<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <title>商品編集 - 管理画面 - Solo Shop</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto flex max-w-7xl flex-col gap-4 px-4 py-6 lg:flex-row lg:gap-6">
        <aside id="admin-sidebar" class="w-full lg:w-52 lg:shrink-0"></aside>
        <main class="min-w-0 flex-1">
          <div class="max-w-2xl">
            <h1 id="page-title" class="mb-6 text-xl font-bold">新規商品登録</h1>
            <form id="product-form" class="card flex flex-col gap-4 p-6">
              <p id="error-msg" class="hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>
              <div>
                <label class="mb-1 block text-sm text-gray-600">商品名</label>
                <input id="name" required class="input" />
              </div>
              <div>
                <label class="mb-1 block text-sm text-gray-600">説明</label>
                <textarea id="description" required class="input" rows="3"></textarea>
              </div>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <div>
                  <label class="mb-1 block text-sm text-gray-600">SKU</label>
                  <input id="sku" required class="input" />
                </div>
                <div>
                  <label class="mb-1 block text-sm text-gray-600">ブランド</label>
                  <input id="brand" class="input" />
                </div>
              </div>
              <div>
                <label class="mb-1 block text-sm text-gray-600">カテゴリ</label>
                <select id="category-id" required class="input">
                  <option value="">選択してください</option>
                </select>
              </div>
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
                <div>
                  <label class="mb-1 block text-sm text-gray-600">販売価格</label>
                  <input id="price" required type="number" min="0" class="input" />
                </div>
                <div>
                  <label class="mb-1 block text-sm text-gray-600">元の価格（任意）</label>
                  <input id="original-price" type="number" min="0" class="input" />
                </div>
                <div>
                  <label class="mb-1 block text-sm text-gray-600">在庫数</label>
                  <input id="stock" required type="number" min="0" class="input" value="0" />
                </div>
              </div>
              <div>
                <label class="mb-1 block text-sm text-gray-600">消費税率</label>
                <select id="tax-rate" class="input">
                  <option value="10">10%（標準税率）</option>
                  <option value="8">8%（軽減税率 — 飲食料品）</option>
                </select>
                <p class="mt-1 text-xs text-gray-400">価格は税込で入力してください。飲食料品（酒類・外食を除く）は8%です。</p>
              </div>
              <div>
                <label class="mb-1 block text-sm text-gray-600">商品写真</label>
                <div id="image-list" class="mb-2 flex flex-wrap gap-3"></div>
                <p id="no-image-msg" class="mb-2 text-sm text-gray-400">まだ写真がありません</p>
                <label class="btn-secondary inline-flex cursor-pointer">
                  写真を選ぶ
                  <input id="image-file" type="file" accept="image/jpeg,image/png,image/gif,image/webp" class="hidden" />
                </label>
                <span id="upload-status" class="ml-2 text-sm text-gray-500"></span>
                <p class="mt-1 text-xs text-gray-400">JPEG / PNG / GIF / WebP、1枚5MBまで。撮影場所などの記録は公開前に自動で取り除かれます。</p>
                <details class="mt-2">
                  <summary class="cursor-pointer text-xs text-gray-500">写真をURLで指定する</summary>
                  <textarea id="images" class="input mt-1" rows="3" placeholder="1行に1つURLを入力"></textarea>
                </details>
              </div>
              <div class="flex gap-3">
                <button id="submit-btn" type="submit" class="btn-primary">保存する</button>
                <a href="products.html" class="btn-secondary">キャンセル</a>
              </div>
            </form>
          </div>
        </main>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="../assets/js/pages/admin-product-form.js"></script>
  </body>
</html>
