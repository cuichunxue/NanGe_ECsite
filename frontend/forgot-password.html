<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>パスワードをお忘れの方 - Solo Shop</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solo Shop" />
    <meta property="og:title" content="パスワードをお忘れの方 - Solo Shop" />
    <meta property="og:description" content="パスワードの再設定手続きはこちらから。" />
    <meta property="og:url" content="https://shop.example.com/forgot-password.html" />
    <meta property="og:image" content="https://shop.example.com/assets/img/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div class="mx-auto flex max-w-md flex-col gap-6 px-4 py-16">
        <h1 class="text-center text-2xl font-bold">パスワードをお忘れの方</h1>
        <form id="forgot-form" class="card flex flex-col gap-4 p-6">
          <p class="text-sm text-gray-500">ご登録のメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p>
          <p id="error-msg" class="hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>
          <p id="success-msg" class="hidden rounded bg-blue-50 px-3 py-2 text-sm text-blue-700"></p>
          <p id="dev-link-msg" class="hidden rounded bg-amber-50 px-3 py-2 text-xs text-amber-700">
            開発環境用リンク（本番ではメールで届きます）: <a id="dev-link" class="underline">こちらから再設定</a>
          </p>
          <div>
            <label class="mb-1 block text-sm text-gray-600">メールアドレス</label>
            <input id="email" type="email" required class="input" />
          </div>
          <button id="submit-btn" type="submit" class="btn-primary w-full">送信する</button>
          <p class="text-center text-sm text-gray-500">
            <a href="login.html" class="text-brand-500 hover:underline">ログイン画面に戻る</a>
          </p>
        </form>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/forgot-password.js"></script>
  </body>
</html>
