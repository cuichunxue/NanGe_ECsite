<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <title>新しいパスワードの設定 - Solo Shop</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solo Shop" />
    <meta property="og:title" content="新しいパスワードの設定 - Solo Shop" />
    <meta property="og:description" content="新しいパスワードを設定します。" />
    <meta property="og:url" content="https://shop.example.com/reset-password.html" />
    <meta property="og:image" content="https://shop.example.com/assets/img/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="flex min-h-screen flex-col">
    <div id="site-header"></div>
    <div class="flex-1">
      <div id="invalid-token-view" class="mx-auto hidden max-w-md px-4 py-16 text-center">
        <p class="text-sm text-red-600">リセットリンクが不正です。もう一度パスワード再設定をリクエストしてください。</p>
        <a href="forgot-password.html" class="mt-4 inline-block text-brand-500 hover:underline">パスワード再設定をリクエスト</a>
      </div>

      <div id="form-view" class="mx-auto hidden max-w-md flex-col gap-6 px-4 py-16">
        <h1 class="text-center text-2xl font-bold">新しいパスワードの設定</h1>
        <form id="reset-form" class="card flex flex-col gap-4 p-6">
          <p id="error-msg" class="hidden rounded bg-red-50 px-3 py-2 text-sm text-red-600"></p>
          <div>
            <label class="mb-1 block text-sm text-gray-600">新しいパスワード（英数字含む8文字以上）</label>
            <input id="new-password" type="password" required minlength="8" class="input" />
          </div>
          <button id="submit-btn" type="submit" class="btn-primary w-full">パスワードを再設定する</button>
        </form>
      </div>
    </div>
    <div id="site-footer"></div>
    <script type="module" src="assets/js/pages/reset-password.js"></script>
  </body>
</html>
